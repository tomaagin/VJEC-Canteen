{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VJEC Canteen Portal</title>

    <link rel="stylesheet" href="{% static 'styles/style.css' %}">

</head>


<body class="login-bg">


    <!-- Main Container -->
    <div class="login-container">


        <!-- =========================
             LEFT SIDE
             ========================= -->

        <div class="login-header">


            <!-- VJEC Logo -->

            <img src="{% static 'images/vjec-logo.png' %}" alt="Vimal Jyothi Engineering College Logo"
                class="vjec-logo">


            <!-- College Information -->

            <div class="college-info">

                <h1>VJEC</h1>

                <h2>Canteen Portal</h2>

                <p>
                    Smart food ordering for students and staff.
                </p>

            </div>


        </div>



        <!-- =========================
             RIGHT SIDE
             ========================= -->

        <div class="login-body">


            <form action="" method="post">

                {% csrf_token %}


                <!-- Login Title -->

                <div class="form-title">

                    <h2>Login</h2>

                    <p>
                        Welcome back! Please login to continue.
                    </p>

                </div>



                <!-- Admission Number -->

                <div class="input-group">

                    <label for="username">
                        Admission Number
                    </label>

                    <input type="text" name="username" id="username" placeholder="Enter your admission number"
                        autocomplete="off" required>

                </div>



                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" name="password" id="password" placeholder="Enter your password"
                        autocomplete="off" required>

                </div>



                <!-- Login Options -->

                <div class="login-options">

                    <label>

                        <input type="checkbox" name="remember">

                        Remember me

                    </label>




                </div>



                <!-- Login Button -->

                <button type="submit" class="login-btn">

                    Login

                    <span>→</span>

                </button>


            </form>


        </div>



        <!-- =========================
             FOOTER
             ========================= -->

        <div class="login-footer">

            <p>
                NEW TO CANTEEN PORTAL?
            </p>


            <a href="{% url 'register' %}" class="register-link">
                Create an Account
            </a>

        </div>


    </div>


</body>

</html>
