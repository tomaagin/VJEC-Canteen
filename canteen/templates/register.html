{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | VJEC Canteen Portal</title>

    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>

<body class="register-bg">

    <div class="register-container">

        <!-- Header -->
        <div class="register-header">

            <div class="register-logo">
                V
            </div>

            <h1>VJEC</h1>

            <h2>Canteen Portal</h2>

            <p>
                Create your account to get started.
            </p>

        </div>


        <!-- Registration Form -->
        <div class="register-body">

            <form action="" method="post">

                {% csrf_token %}

                <!-- Admission Number -->
                <div class="register-input">

                    <label for="username">
                        Admission Number
                    </label>

                    <input type="text" name="username" id="username" placeholder="Enter your admission number"
                        autocomplete="username" required>

                </div>


                <!-- Email -->
                <div class="register-input">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" name="email" id="email" placeholder="Enter your email" autocomplete="email"
                        required>

                </div>


                <!-- Password -->
                <div class="register-input">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" name="password" id="password" placeholder="Create a password"
                        autocomplete="new-password" required>

                </div>


                <!-- Confirm Password -->
                <div class="register-input">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input type="password" name="confirm_password" id="confirm_password"
                        placeholder="Confirm your password" autocomplete="new-password" required>

                </div>


                <!-- Register Button -->
                <button type="submit" class="register-submit">
                    Create Account
                    <span>→</span>
                </button>

            </form>

        </div>


        <!-- Login Section -->
        <div class="register-footer">

            <p>
                ALREADY HAVE AN ACCOUNT?
            </p>

            <a href="{% url 'login' %}">
                Login to your account
            </a>

        </div>

    </div>

</body>

</html>
